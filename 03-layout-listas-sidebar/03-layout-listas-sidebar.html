<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>3 - Layout sidebar</title>
    <link rel="stylesheet" href="/nombre-del-proyecto/03-layout-listas-sidebar/style.css">
</head>
<body>
    <header class="header">
        <div class="navbar-left">
            <img src="https://placehold.co/32x32" alt="Logo">
            <h1>Pokédex</h1>
        </div>
    </header>
    <div class="container">
        <aside class="sidebar">
            <ul class="menu">
                <li class="menu-item">
                     Dashboard
                </li>
                <li class="menu-item">
                     Pokémon
                </li>
                <li class="menu-item">
                     Historial
                </li>
            </ul>
        </aside>
        <main class="main-container">
            <h2>Bienvenido</h2>
            <section class="cards-container">
                <!-- cards -->
                <div class= "card">
                    <h3 class="car-title">Charmander</h3>
                    <Figure>
                        <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/004.png" alt="charchar" class="card-img">
                        <figcaption class="card-text">Tipo: Fuego</figcaption>
                    </Figure>
                    <a href="https://pokemon.fandom.com/wiki/Charmander" target="_self">Ver más</a>
                </div>
        
                <div class= "card">
                    <h3 class="car-title">Beedrill</h3>
                    <Figure>
                        <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/015.png" alt="BEEBEE" class="card-img">
                        <figcaption class="card-text">Tipo: Bicho</figcaption>
                    </Figure>
                    <a href="https://pokemon.fandom.com/wiki/Beedrill" target="_self">Ver más</a>
                </div>
        
                <div class= "card">
                    <h3 class="car-title">Arbok</h3>
                    <Figure>
                        <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/024.png" alt="ARAR" class="card-img">
                        <figcaption class="card-text">Tipo: Veneno</figcaption>
                    </Figure>
                    <a href="https://pokemon.fandom.com/wiki/Arbok" target="_self">Ver más</a>
                </div>
        
                <div class= "card">
                    <h3 class="car-title">Nidoran</h3>
                    <Figure>
                        <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/032.png" alt="nidonida" class="card-img">
                        <figcaption class="card-text">Tipo: Veneno</figcaption>
                    </Figure>
                    <a href="https://pokemon.fandom.com/wiki/Nidoran" target="_self">Ver más</a>
                </div>
        
                <div class= "card">
                    <h3 class="car-title">Alakazam</h3>
                    <Figure>
                        <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/065.png" alt="kabraka" class="card-img">
                        <figcaption class="card-text">Tipo: Psíquico</figcaption>
                    </Figure>
                    <a href="https://pokemon.fandom.com/wiki/Alakazam" target="_self">Ver más</a>
                </div>
        
                <div class= "card">
                    <h3 class="car-title">Moltres</h3>
                    <Figure>
                        <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/146.png" alt="Molmol" class="card-img">
                        <figcaption class="card-text">Tipo: Fuego</figcaption>
                    </Figure>
                    <a href="https://pokemon.fandom.com/wiki/Moltres" target="_self">Ver más</a>
                </div>
            </section>
        </main>
    </div>
    <footer class="footer">
        <p>3 - Layout sidebar</p>
    </footer>
</body>
</html>
