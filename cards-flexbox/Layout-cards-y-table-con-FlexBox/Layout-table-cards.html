<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style-table.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
</head>
<body>
    <!-- Algunas aclaraciones: -->
    <!-- Header: -->
    <!-- navbar con contenido a la izquierda y a la derecha -->
    <!-- background-color a elección pero distinto a main, puede ser el mismo que footer -->
    <!-- Main: -->
    <!-- Compuesto por 3 secciones, cada una tiene: -->
    <!-- Card con título, imagen y texto -->
    <!-- Table para agregar los estilos podrá investigar en w3school - tables -->
    <!-- El contenido puede ser a elección del estudiante pero la información de la card debe estar vinculada con la información de la table -->
    <header>
        <nav class="navbar">
            <img class="logo" src="https://tse3.mm.bing.net/th/id/OIP.DyKVe_lsHT4dT3IkmEqEUwAAAA?w=250&h=250&rs=1&pid=ImgDetMain&o=7&rm=3" alt="logo">
            <h1>Usuario</h1>
        </nav>
    </header>
    <main class="main-cont2">
        <!-- Dentro de main van 3 section con una card y una tabla con 3 columnas -->
        <section>        
            <div class= "card">
                <h3 class="car-title">Charmander</h3>
                <Figure>
                    <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/004.png" alt="charchar" class="card-img">
                    <figcaption class="card-text">Tipo: Fuego</figcaption>
                </Figure>
                <a href="https://pokemon.fandom.com/wiki/Charmander" target="_self">Ver más</a>
            </div>
        </section>
        <section>
            <div class= "card">
                <h3 class="car-title">Beedrill</h3>
                <Figure>
                    <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/015.png" alt="BEEBEE" class="card-img">
                    <figcaption class="card-text">Tipo: Bicho</figcaption>
                </Figure>
                <a href="https://pokemon.fandom.com/wiki/Beedrill" target="_self">Ver más</a>
            </div>
        </section>
        <section>
            <div class= "card">
                <h3 class="car-title">Arbok</h3>
                <Figure>
                    <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/024.png" alt="ARAR" class="card-img">
                    <figcaption class="card-text">Tipo: Veneno</figcaption>
                </Figure>
                <a href="https://pokemon.fandom.com/wiki/Arbok" target="_self">Ver más</a>
            </div>
        </section>
    </main>
    <footer>
        <h3>Benjamín Olivera</h3>
    </footer>
</body>
</html>
